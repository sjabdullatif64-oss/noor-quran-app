##############################################################################
# Temporary Android SDK runner diagnostic.
# This workflow intentionally does not invoke android-actions/setup-android.
# Remove after the one controlled diagnostic run.
##############################################################################

name: Temporary Android SDK Diagnostic

on:
  workflow_dispatch:

env:
  ANDROID_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  diagnose:
    name: Inspect ubuntu-latest Android SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Inspect existing Android environment
        shell: bash
        run: |
          set +e
          echo "=== Runner identity ==="
          uname -a
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo

          echo "=== Android environment variables ==="
          printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:-<unset>}"
          printf 'ANDROID_SDK_ROOT=%s\n' "${ANDROID_SDK_ROOT:-<unset>}"
          echo

          echo "=== sdkmanager lookup ==="
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -n "$SDKMANAGER" ]]; then
            echo "sdkmanager exists: $SDKMANAGER"
          else
            echo "sdkmanager exists: NO"
          fi
          echo

          echo "=== Java ==="
          java -version 2>&1
          echo "java exit: $?"
          echo

          echo "=== SDK directories and permissions ==="
          for DIR in \
            "${ANDROID_HOME:-}" \
            "${ANDROID_SDK_ROOT:-}" \
            "/usr/local/lib/android/sdk" \
            "/opt/android-sdk" \
            "/opt/android-sdk-linux"; do
            [[ -n "$DIR" ]] || continue
            if [[ -e "$DIR" ]]; then
              stat -c 'path=%n owner=%U:%G mode=%A type=%F' "$DIR"
              find "$DIR" -maxdepth 1 -mindepth 1 -type d -printf '  %f owner=%u:%g mode=%m\n' 2>/dev/null | sort
            else
              echo "missing: $DIR"
            fi
          done
          echo

          echo "=== cmdline-tools directories ==="
          find /usr/local/lib/android/sdk /opt/android-sdk /opt/android-sdk-linux \
            -maxdepth 4 -type d -path '*/cmdline-tools*' -printf '%p owner=%u:%g mode=%m\n' \
            2>/dev/null | sort || true
          echo

          echo "=== installed SDK components ==="
          for ROOT in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk"; do
            [[ -d "$ROOT" ]] || continue
            echo "SDK root: $ROOT"
            find "$ROOT/platforms" -maxdepth 1 -mindepth 1 -type d -printf 'platform=%f\n' 2>/dev/null | sort
            find "$ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d -printf 'build-tools=%f\n' 2>/dev/null | sort
            find "$ROOT/platform-tools" -maxdepth 1 -type f -printf 'platform-tools-file=%f\n' 2>/dev/null | head -20
          done
          echo

          echo "=== sdkmanager version ==="
          if [[ -n "$SDKMANAGER" ]]; then
            "$SDKMANAGER" --version 2>&1
            echo "sdkmanager --version exit: $?"
          else
            echo "sdkmanager --version: NOT RUN (sdkmanager missing)"
          fi
          echo

          echo "=== Diagnostic answers so far ==="
          [[ -n "$ANDROID_HOME$ANDROID_SDK_ROOT" ]] && echo "1. Existing Android SDK: YES" || echo "1. Existing Android SDK: NO"
          [[ -n "$SDKMANAGER" ]] && echo "2. sdkmanager exists: YES" || echo "2. sdkmanager exists: NO"
          if [[ -n "$SDKMANAGER" ]]; then
            "$SDKMANAGER" --version >/tmp/sdkmanager-version.txt 2>&1
            [[ $? -eq 0 ]] && echo "3. sdkmanager runs: YES" || echo "3. sdkmanager runs: NO"
          else
            echo "3. sdkmanager runs: NO (missing)"
          fi

      - name: Inspect repository access and package availability
        shell: bash
        run: |
          set +e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "4. Google Android repository access: NOT TESTED (sdkmanager missing)"
            echo "5. API 36 visibility/install: NOT TESTED (sdkmanager missing)"
            echo "6. build-tools 36.0.0 visibility/install: NOT TESTED (sdkmanager missing)"
            exit 0
          fi

          echo "=== sdkmanager package listing / repository access ==="
          "$SDKMANAGER" --list > /tmp/sdkmanager-list.txt 2>&1
          LIST_STATUS=$?
          echo "sdkmanager --list exit: $LIST_STATUS"
          sed -n '1,160p' /tmp/sdkmanager-list.txt
          if [[ $LIST_STATUS -eq 0 ]]; then
            echo "4. Google Android repository access: YES"
          else
            echo "4. Google Android repository access: NO"
          fi

          if grep -Eq 'platforms;android-36([[:space:]]|$)' /tmp/sdkmanager-list.txt; then
            echo "5. API 36 visible to sdkmanager: YES"
          else
            echo "5. API 36 visible to sdkmanager: NO"
          fi
          if grep -Eq 'build-tools;36\.0\.0([[:space:]]|$)' /tmp/sdkmanager-list.txt; then
            echo "6. build-tools 36.0.0 visible to sdkmanager: YES"
          else
            echo "6. build-tools 36.0.0 visible to sdkmanager: NO"
          fi

      - name: Install exact SDK packages with existing sdkmanager
        shell: bash
        run: |
          set +e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Exact package install: NOT RUN (sdkmanager missing)"
            exit 0
          fi

          echo "=== Installing exact requested packages with existing sdkmanager ==="
          yes | "$SDKMANAGER" --licenses >/tmp/sdkmanager-licenses.txt 2>&1
          echo "licenses exit: $?"
          "$SDKMANAGER" --install \
            "platforms;android-${ANDROID_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools" \
            2>&1
          INSTALL_STATUS=$?
          echo "sdkmanager exact package install exit: $INSTALL_STATUS"

          ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [[ -d "$ROOT/platforms/android-${ANDROID_SDK}" ]] \
            && echo "API 36 accessible after install: YES" \
            || echo "API 36 accessible after install: NO"
          [[ -d "$ROOT/build-tools/${ANDROID_BUILD_TOOLS}" ]] \
            && echo "build-tools 36.0.0 accessible after install: YES" \
            || echo "build-tools 36.0.0 accessible after install: NO"
          [[ -x "$ROOT/platform-tools/adb" ]] \
            && echo "platform-tools accessible after install: YES" \
            || echo "platform-tools accessible after install: NO"

          echo "=== Final diagnostic boundary ==="
          echo "7. This workflow did not invoke android-actions/setup-android."
          echo "Compare this result with canonical run #392, which failed inside Setup Android SDK."

          # The diagnostic reports all boundaries without hiding the evidence,
          # but package installation failure makes the diagnostic job visibly fail.
          exit "$INSTALL_STATUS"