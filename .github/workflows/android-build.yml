##############################################################################
# Noor Quran — Android Build Pipeline (Capacitor)
# Package: com.sj64noorquran
#
# Triggers:
#   • Every push to main/master  → release build
#   • Every git tag  v*          → release build + GitHub Release
#   • Manual dispatch            → choose debug or release, set version
#
# Secrets required (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      base64-encoded .keystore file  (existing Play Store key)
#   KEYSTORE_PASSWORD    keystore store password
#   KEY_ALIAS            key alias inside the keystore  (my-key-alias)
#   KEY_PASSWORD         key password
##############################################################################

name: Noor Quran — Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]
      version_name:
        description: 'Version name e.g. 1.2.0 (leave blank to use the source version)'
        required: false
        default: ''
      version_code:
        description: 'Version code  integer — MUST be higher than last Play Store upload'
        required: false
        default: ''

env:
  NODE_VERSION:   '22'
  JAVA_VERSION:   '21'          # Java 21 — required by capacitor-android v8
  GRADLE_VERSION: '8.13'
  PNPM_VERSION:   '10.26.1'   # must match "packageManager" in root package.json
  ANDROID_SDK:         '36'          # compileSdk + targetSdk (both 36 in app/build.gradle)
  ANDROID_BUILD_TOOLS: '36.0.0'
  BUNDLETOOL_VERSION:  '1.18.1'
  APP_DIR:             artifacts/islamic-app
  ANDROID_DIR:         artifacts/islamic-app/android

jobs:
  build:
    name: >
      Build ${{ github.event.inputs.build_type || 'release' }}
      v${{ github.event.inputs.version_name || '1.0.23' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60        # first build ~20 min; cached ~8 min

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so git describe works for version

      # Never let ignored/generated Capacitor assets or a previous workspace
      # survive into this build. The web bundle must come from this checkout.
      - name: Verify clean source checkout
        working-directory: ${{ env.APP_DIR }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$SOURCE_SHA" = "${{ github.sha }}" || {
            echo "❌ Checkout SHA mismatch: $SOURCE_SHA != ${{ github.sha }}"
            exit 1
          }
          rm -rf dist/public android/app/src/main/assets
          mkdir -p dist/public
          echo "✅ Building exact checkout $SOURCE_SHA"

      # ── 2. Java 17 (Gradle daemon + javac) ───────────────────────────────────
      #
      #    All Capacitor plugins that hardcode JavaVersion.VERSION_21 are
      #    overridden to Java 17 via the subprojects hook in android/build.gradle.
      #    org.gradle.java.installations.auto-download=false in gradle.properties
      #    prevents Gradle from searching for / downloading a Java 21 toolchain.
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── 3. Android SDK 36 ─────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform + build-tools
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_SDK }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "platform-tools" \
            2>&1 | tail -5
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          test -x "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/aapt2"
          "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/aapt2" version
          # Remove android-34 from ALL known SDK locations: its core-for-system-modules.jar
          # is incompatible with Java 21 jlink.  AGP falls back to android-34 when
          # android-36 has no jar.  Removing it forces AGP to skip JdkImageTransform.
          rm -rf "$ANDROID_HOME/platforms/android-34" || true
          rm -rf "/usr/local/lib/android/sdk/platforms/android-34" || true
          echo "android-34 removal: $(ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null | tr '\n' ' ')"

      # ── 4. Gradle ${{ env.GRADLE_VERSION }} ──────────────────────────────────
      - name: Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # ── 5. Node.js + pnpm ────────────────────────────────────────────────────
      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Resolve version name + code ────────────────────────────────────────
      #    Resolve before the web build so the embedded manifest and native
      #    Android metadata always carry the same version values.
      - name: Resolve version
        id: version
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          EXISTING_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          EXISTING_CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version_name }}" ]]; then
            VER_NAME="${{ github.event.inputs.version_name }}"
          else
            VER_NAME="$EXISTING_NAME"
          fi
          if [[ -n "${{ github.event.inputs.version_code }}" ]]; then
            VER_CODE="${{ github.event.inputs.version_code }}"
          else
            VER_CODE="$EXISTING_CODE"
          fi
          if [[ ! "$VER_CODE" =~ ^[0-9]+$ ]] || (( VER_CODE <= 79845459 )); then
            echo "❌ versionCode must be an integer greater than 79845459."
            exit 1
          fi
          echo "name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "✅ Version $VER_NAME ($VER_CODE)"

      # ── 7. Vite production build ──────────────────────────────────────────────
      - name: Build web assets (Vite)
        run: pnpm --filter @workspace/islamic-app run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_VERSION: ${{ steps.version.outputs.name }}
          VITE_BUILD_CODE: ${{ steps.version.outputs.code }}

      - name: Verify fresh web bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -n "$(find dist/public/assets -type f -name '*.js' -print -quit)"
          grep -a -R -l "${{ steps.version.outputs.name }}" dist/public/assets dist/public/index.html
          grep -a -R -l "${{ steps.version.outputs.code }}" dist/public/assets dist/public/index.html
          grep -a -R -l "noor-transliteration-language-changed" dist/public/assets
          grep -a -R -l "اللہ" dist/public/assets
          cat > dist/public/build-manifest.json <<EOF
          {
            "sourceSha": "${{ github.sha }}",
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": "${{ steps.version.outputs.code }}",
            "quranDisplay": "shared-display-boundary",
            "transliterationControl": "independent"
          }
          EOF
          echo "✅ Fresh Vite bundle contains ${{ steps.version.outputs.name }}, Allah display, and independent transliteration control"

      # ── 8. Capacitor sync ────────────────────────────────────────────────────
      - name: Sync Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android 2>&1
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_HOME:     ${{ env.ANDROID_HOME }}

      - name: Verify Capacitor received fresh web bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          test -f android/app/src/main/assets/public/build-manifest.json
          diff -u dist/public/build-manifest.json android/app/src/main/assets/public/build-manifest.json
          test ! -e android/app/src/main/assets/public/assets/index-CioVTHgR.js
          grep -a -R -l "${{ steps.version.outputs.name }}" android/app/src/main/assets/public/assets android/app/src/main/assets/public/index.html
          grep -a -R -l "${{ steps.version.outputs.code }}" android/app/src/main/assets/public/assets android/app/src/main/assets/public/index.html
          grep -a -R -l "noor-transliteration-language-changed" android/app/src/main/assets/public/assets
          grep -a -R -l "اللہ" android/app/src/main/assets/public/assets
          ! grep -a -R -l "1\\.0\\.19" android/app/src/main/assets/public/assets
          echo "✅ Capacitor assets match checkout ${{ github.sha }}"

      # ── 9. Gradle wrapper ─────────────────────────────────────────────────────
      - name: Generate Gradle wrapper
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle wrapper \
            --gradle-version ${{ env.GRADLE_VERSION }} \
            --distribution-type bin \
            --no-daemon
          chmod +x gradlew
          echo "✅ gradlew generated (Gradle ${{ env.GRADLE_VERSION }})"

      # ── 9. Stamp version into build.gradle ───────────────────────────────────
      - name: Stamp version in build.gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          sed -i \
            "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" \
            app/build.gradle
          sed -i \
            "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" \
            app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      # ── 11. Keystore (release builds only) ────────────────────────────────────
      #
      #    ⚠️  IMPORTANT — EXISTING PLAY STORE APP:
      #    Use the SAME keystore you used for your first Play Store upload.
      #    Changing the keystore will break updates for existing users.
      #
      - name: Decode keystore
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "❌ Secret KEYSTORE_BASE64 is not set."
            echo "   Base64-encode your keystore:  base64 -w0 upload-key.keystore"
            echo "   Then add it as a repo secret: Settings → Secrets → KEYSTORE_BASE64"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-key.keystore
          keytool -list -v \
            -keystore app/upload-key.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | grep -E "Alias|Valid|SHA" || true
          echo "✅ Keystore decoded and verified"
          # Write keystore.properties so the signing config in app/build.gradle picks it up
          cat > keystore.properties <<EOF
          storeFile=upload-key.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ keystore.properties written"

      # ── 12a. Debug build ───────────────────────────────────────────────────────
      - name: Build Debug APK
        if: ${{ (github.event.inputs.build_type || 'release') == 'debug' }}
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode summary
          echo "✅ Debug APK built"

      # ── 12b. Release build (signed APK + signed AAB) ─────────────────────────
      #
      # -PMINIFY_RELEASE=true enables R8 minification + resource shrinking.
      # (Local builds omit this flag so the build stays under 2 min.)
      - name: Build Release APK and AAB
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          # Clear stale Gradle transform caches (avoids jlink failure from cached android-34 jmod)
          rm -rf ~/.gradle/caches/*/transforms/ || true
          ./gradlew assembleRelease bundleRelease \
            -PMINIFY_RELEASE=true \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            --warning-mode summary
          echo "✅ Release APK built"
          echo "✅ Release AAB built"
        env:
          KEYSTORE_PATH:     app/upload-key.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}

      # ── 13. Rename outputs with version ───────────────────────────────────────
      - name: Rename build outputs
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          V="${{ steps.version.outputs.name }}"
          BUILD="${{ github.event.inputs.build_type || 'release' }}"
          if [[ "$BUILD" == "release" ]]; then
            cp app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/release/noor-quran-${V}.apk
             cp app/build/outputs/bundle/release/app-release.aab \
                app/build/outputs/bundle/release/noor-quran-${V}.aab
            echo "APK: $(du -h app/build/outputs/apk/release/noor-quran-${V}.apk)"
            echo "AAB: $(du -h app/build/outputs/bundle/release/noor-quran-${V}.aab)"
          else
            cp app/build/outputs/apk/debug/app-debug.apk \
               app/build/outputs/apk/debug/noor-quran-${V}-debug.apk
          fi
          echo "✅ Outputs renamed to noor-quran-${V}"

      - name: Verify generated APK and AAB contents
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          APK="app/build/outputs/apk/release/noor-quran-${{ steps.version.outputs.name }}.apk"
          AAB="app/build/outputs/bundle/release/noor-quran-${{ steps.version.outputs.name }}.aab"
          test -f "$APK"
          test -f "$AAB"

          # Decode the actual release bundle manifest. Source declarations and
          # Gradle intermediates are not sufficient proof of what Play receives.
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-${{ env.BUNDLETOOL_VERSION }}.jar"
          curl -fsSL --retry 3 \
            -o "$BUNDLETOOL" \
            "https://github.com/google/bundletool/releases/download/${{ env.BUNDLETOOL_VERSION }}/bundletool-all-${{ env.BUNDLETOOL_VERSION }}.jar"
          echo "675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  $BUNDLETOOL" | sha256sum --check
          java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/noor-aab-manifest.xml"

          AAB_MANIFEST="$RUNNER_TEMP/noor-aab-manifest.xml"
          AAB_PACKAGE=$(grep -oP 'package="\K[^"]+' "$AAB_MANIFEST" | head -1)
          AAB_TARGET=$(grep -oP 'android:targetSdkVersion="\K[0-9]+' "$AAB_MANIFEST" | head -1)
          AAB_COMPILE=$(grep -oP 'android:compileSdkVersion="\K[0-9]+' "$AAB_MANIFEST" | head -1)
          AAB_PLATFORM=$(grep -oP 'platformBuildVersionCode="\K[0-9]+' "$AAB_MANIFEST" | head -1)
          AAB_NAME=$(grep -oP 'android:versionName="\K[^"]+' "$AAB_MANIFEST" | head -1)
          AAB_CODE=$(grep -oP 'android:versionCode="\K[0-9]+' "$AAB_MANIFEST" | head -1)
          [[ "$AAB_PACKAGE" == "com.sj64noorquran" ]]
          [[ "$AAB_TARGET" =~ ^[0-9]+$ ]] && (( AAB_TARGET >= 36 ))
          [[ "$AAB_COMPILE" =~ ^[0-9]+$ ]] && (( AAB_COMPILE >= 36 ))
          [[ "$AAB_PLATFORM" =~ ^[0-9]+$ ]] && (( AAB_PLATFORM >= 36 ))
          [[ "$AAB_NAME" == "${{ steps.version.outputs.name }}" ]]
          [[ "$AAB_CODE" == "${{ steps.version.outputs.code }}" ]]
          grep -q 'ca-app-pub-9913546614303490~8586508933' "$AAB_MANIFEST"

          AAPT2="$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/aapt2"
          "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/noor-apk-badging.txt"
          grep -q "package: name='com.sj64noorquran'" "$RUNNER_TEMP/noor-apk-badging.txt"
          grep -q "versionCode='${{ steps.version.outputs.code }}'" "$RUNNER_TEMP/noor-apk-badging.txt"
          grep -q "versionName='${{ steps.version.outputs.name }}'" "$RUNNER_TEMP/noor-apk-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/noor-apk-badging.txt"

          for FILE in "$APK" "$AAB"; do
            MANIFEST_ENTRY=$(unzip -Z1 "$FILE" | grep -E '(^|/)assets/public/build-manifest\.json$' | head -1)
            test -n "$MANIFEST_ENTRY"
            unzip -p "$FILE" "$MANIFEST_ENTRY" > /tmp/noor-build-manifest.json
            grep -a -q '"sourceSha": "${{ github.sha }}"' /tmp/noor-build-manifest.json
            grep -a -q '"versionName": "${{ steps.version.outputs.name }}"' /tmp/noor-build-manifest.json
            grep -a -q '"versionCode": "${{ steps.version.outputs.code }}"' /tmp/noor-build-manifest.json
            : > /tmp/noor-web-bundle.js
            while IFS= read -r BUNDLE_ENTRY; do
              unzip -p "$FILE" "$BUNDLE_ENTRY" >> /tmp/noor-web-bundle.js
            done < <(unzip -Z1 "$FILE" | grep -E '(^|/)assets/public/assets/[^/]+\.js$')
            grep -a -q 'اللہ' /tmp/noor-web-bundle.js
            grep -a -q 'noor-transliteration-language-changed' /tmp/noor-web-bundle.js
            grep -a -q '${{ steps.version.outputs.code }}' /tmp/noor-web-bundle.js
            grep -a -q 'ca-app-pub-9913546614303490/1013114555' /tmp/noor-web-bundle.js
            ! grep -a -q 'ca-app-pub-1852283311826362' /tmp/noor-web-bundle.js
            ! grep -a -q '1\.0\.19' /tmp/noor-web-bundle.js
          done
          echo "✅ APK/AAB prove package, version, target/compile SDK 36+, fresh web assets, and current banner AdMob ID"

      # ── 14. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Debug APK
        if: ${{ (github.event.inputs.build_type || 'release') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-debug-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/noor-quran-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-apk-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/noor-quran-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release AAB
        if: ${{ (github.event.inputs.build_type || 'release') == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-aab-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/noor-quran-*.aab
          if-no-files-found: error
          retention-days: 90

      # ── 15. GitHub Release (tag pushes only) ──────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Noor Quran ${{ steps.version.outputs.name }}"
          generate_release_notes: true
          files: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/noor-quran-*.apk
            ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/noor-quran-*.aab
          body: |
            ## Noor Quran ${{ steps.version.outputs.name }}

            | File | Use |
            |------|-----|
            | `noor-quran-${{ steps.version.outputs.name }}.apk` | Sideload directly on Android |

            **Package:** `com.sj64noorquran`
            **Version code:** ${{ steps.version.outputs.code }}
            **Java:** 17 · **SDK:** 36 · **Gradle:** ${{ env.GRADLE_VERSION }}

            ### What's inside
            - Native Capacitor Android shell — no browser UI, no URL bar
            - Dark status bar (`#071a0e`) + full-screen edge-to-edge
            - Native splash screen, hardware back-button support
            - AdMob native banner ads (`ca-app-pub-9913546614303490`)
            - Native push notifications (prayer alarms via LocalNotifications)
            - Quran reader · supported translation languages · Al-Afasy audio
            - GPS prayer times · Qibla compass
            - Offline audio downloads (IndexedDB + Filesystem)
            - Tasbeeh counter with haptic feedback
            - Islamic calendar · Islamic Gifts · Bookmarks · Favorites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 16. Build summary ─────────────────────────────────────────────────────
      - name: Print build summary
        if: always()
        run: |
          echo "### Noor Quran Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`com.sj64noorquran\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | ${{ github.event.inputs.build_type || 'release' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | ubuntu-latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android SDK | ${{ env.ANDROID_SDK }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gradle | ${{ env.GRADLE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AGP | 8.9.1 |" >> $GITHUB_STEP_SUMMARY
