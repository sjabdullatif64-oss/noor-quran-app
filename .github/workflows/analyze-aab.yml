name: Analyze AAB Upgrade Issue

on:
  workflow_dispatch:

env:
  PREV_ARTIFACT_ID: '8575409297'
  CURR_ARTIFACT_ID: '8576000083'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install bundletool
        run: |
          curl -L -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar
          java -jar bundletool.jar version

      - name: Download AABs
        run: |
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ env.PREV_ARTIFACT_ID }}/zip" \
            -o prev-artifact.zip
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ env.CURR_ARTIFACT_ID }}/zip" \
            -o curr-artifact.zip
          unzip -o prev-artifact.zip -d prev
          unzip -o curr-artifact.zip -d curr
          mv prev/noor-quran-1.0.16.aab previous.aab
          mv curr/noor-quran-1.0.16.aab current.aab
          ls -lh previous.aab current.aab

      - name: Print certificates
        run: |
          echo "=== PREVIOUS AAB CERTIFICATE ==="
          keytool -printcert -jarfile previous.aab
          echo "=== CURRENT AAB CERTIFICATE ==="
          keytool -printcert -jarfile current.aab

      - name: Dump manifests
        run: |
          echo "=== PREVIOUS MANIFEST ==="
          java -jar bundletool.jar dump manifest --bundle=previous.aab
          echo "=== CURRENT MANIFEST ==="
          java -jar bundletool.jar dump manifest --bundle=current.aab

      - name: Dump files summary
        run: |
          echo "=== PREVIOUS FILES ==="
          java -jar bundletool.jar dump files --bundle=previous.aab | head -100
          echo "=== CURRENT FILES ==="
          java -jar bundletool.jar dump files --bundle=current.aab | head -100

      - name: Extract universal APKs and compare
        run: |
          java -jar bundletool.jar build-apks --bundle=previous.aab --output=previous.apks --mode=universal
          java -jar bundletool.jar build-apks --bundle=current.aab --output=current.apks --mode=universal
          java -jar bundletool.jar extract-apks --apks=previous.apks --output=prev-apk
          java -jar bundletool.jar extract-apks --apks=current.apks --output=curr-apk
          ls -lh prev-apk curr-apk
          echo "=== PREVIOUS APK BADGING ==="
          aapt2 dump badging prev-apk/*.apk
          echo "=== CURRENT APK BADGING ==="
          aapt2 dump badging curr-apk/*.apk

      - name: Get size estimates
        run: |
          echo "=== PREVIOUS SIZE ==="
          java -jar bundletool.jar get-size total --apks=previous.apks
          echo "=== CURRENT SIZE ==="
          java -jar bundletool.jar get-size total --apks=current.apks
