name: Analyze AAB Upgrade Issue

on:
  workflow_dispatch:

env:
  # Previous production AAB candidates
  PREV_1_0_15_ARTIFACT_ID: '8559326938'
  PREV_1_0_16_ARTIFACT_ID: '8575409297'
  CURR_ARTIFACT_ID: '8576000083'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install bundletool
        run: |
          curl -L -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar
          java -jar bundletool.jar version

      - name: Download AABs
        run: |
          download_and_unpack() {
            local id=$1 out=$2
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${id}/zip" \
              -o ${out}.zip
            mkdir -p ${out}
            unzip -o ${out}.zip -d ${out}
            mv ${out}/noor-quran-1.0.16.aab ${out}.aab || mv ${out}/noor-quran-*.aab ${out}.aab
          }
          download_and_unpack ${{ env.PREV_1_0_15_ARTIFACT_ID }} prev_1_0_15
          download_and_unpack ${{ env.PREV_1_0_16_ARTIFACT_ID }} prev_1_0_16
          download_and_unpack ${{ env.CURR_ARTIFACT_ID }} current
          ls -lh *.aab

      - name: Print certificates
        run: |
          for f in prev_1_0_15.aab prev_1_0_16.aab current.aab; do
            echo "=== CERTIFICATE: $f ==="
            keytool -printcert -jarfile $f | grep -E 'Owner|Issuer|SHA256|Serial|Valid'
            echo
          done

      - name: Dump manifests
        run: |
          for f in prev_1_0_15.aab prev_1_0_16.aab current.aab; do
            echo "=== MANIFEST: $f ==="
            java -jar bundletool.jar dump manifest --bundle=$f
          done

      - name: Compare manifests
        run: |
          java -jar bundletool.jar dump manifest --bundle=prev_1_0_15.aab > prev_1_0_15_manifest.xml
          java -jar bundletool.jar dump manifest --bundle=prev_1_0_16.aab > prev_1_0_16_manifest.xml
          java -jar bundletool.jar dump manifest --bundle=current.aab > current_manifest.xml
          echo "=== prev_1_0_15 vs current ==="
          diff -u prev_1_0_15_manifest.xml current_manifest.xml || true
          echo "=== prev_1_0_16 vs current ==="
          diff -u prev_1_0_16_manifest.xml current_manifest.xml || true

      - name: Build universal APKs and dump badging
        run: |
          for f in prev_1_0_15.aab prev_1_0_16.aab current.aab; do
            base=$(basename $f .aab)
            java -jar bundletool.jar build-apks --bundle=$f --output=${base}.apks --mode=universal
            mkdir -p ${base}_apk
            unzip -o ${base}.apks -d ${base}_apk
            echo "=== BADGING: $f ==="
            aapt2 dump badging ${base}_apk/*.apk
          done

      - name: Size estimates
        run: |
          for f in prev_1_0_15.aab prev_1_0_16.aab current.aab; do
            echo "=== SIZE: $f ==="
            ls -lh $f
          done
