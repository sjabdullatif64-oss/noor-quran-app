org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
# Capacitor
android.enableR8.fullMode=false
# Toolchain — do not auto-download a different JDK in CI.
org.gradle.java.installations.auto-download=false
# Disable jlink-based JdkImageTransform (incompatible with Java 21 + android-34 platform jar).
android.useFullClasspathForDexingTransform=true
