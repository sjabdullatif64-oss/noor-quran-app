buildscript {
    ext {
        kotlin_version = '2.0.0'
        // compileSdk must be >= 35: @capacitor/android references
        // Build.VERSION_CODES.VANILLA_ICE_CREAM (API 35) in SystemBars.java.
        // Setting this lower causes "cannot find symbol: VANILLA_ICE_CREAM".
        compileSdkVersion = 36
        buildToolsVersion = '36.0.0'
        // targetSdk 36 = Android 16; meets Google Play targetSdk requirement
        targetSdkVersion  = 36
        minSdkVersion     = 24

        // ── ext vars consumed by @capacitor-community/admob/android/build.gradle ──
        playServicesAdsVersion           = '24.4.0'
        userMessagingPlatformVersion     = '4.0.0'
        androidxAppCompatVersion         = '1.7.0'
        androidxCoordinatorLayoutVersion = '1.2.0'
        androidxCoreKTXVersion           = '1.13.1'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.9.1 is required for this project because:
        //   1. Android SDK 36 dropped the modular jmod from core-for-system-modules.jar.
        //      AGP 7.x JdkImageTransform relies on jlink + that jmod — fails on SDK 36.
        //      AGP 8.x uses a completely redesigned compilation path (no jlink).
        //   2. Transitive AndroidX deps pulled by Capacitor 8 declare minAgpVersion in
        //      their AAR metadata: core:1.17 and activity:1.11 require AGP 8.9.1+,
        //      core-splashscreen:1.2 requires AGP 8.6+.  AGP 8.9.1 satisfies all.
        //   3. AGP 8.13.0 is what capacitor-android itself targets; it fixes the
        //      jlink --disable-plugin system-modules failure introduced in AGP 8.7-8.9.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ── Java 17 override — by name (AGP 8.x compatible) ──────────────────────────
//
// Two plugins hardcode JavaVersion.VERSION_21 in their build.gradle and fail
// when built with a Java 17 JDK:
//   • capacitor-community-admob
//   • capacitor-cordova-android-plugins
//
// AGP 8.x changed compileOptions.sourceCompatibility to a lazy Property<T>.
// Reading it in afterEvaluate throws "sourceCompatibility is not yet finalized",
// so we cannot inspect the current value.  Instead we target the specific
// subproject names we know need the override.
subprojects { sub ->
    sub.afterEvaluate {
        def androidExt = sub.extensions.findByName('android')
        if (androidExt == null) return
        androidExt.buildToolsVersion = rootProject.ext.buildToolsVersion
        androidExt.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
        if (sub.name in ['capacitor-community-admob',
                         'capacitor-cordova-android-plugins']) {
            try {
                androidExt.kotlinOptions { jvmTarget = '17' }
            } catch (ignored) {
                // admob uses Kotlin but cordova-plugins is pure-Java
            }
        }
        if (sub.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            try {
                sub.kotlin { jvmToolchain(17) }
            } catch (ignored) {
                // Java-only Android modules do not expose the Kotlin extension.
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
